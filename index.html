<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KelasNgobrol</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5ca8;--grape:#7b4dff;--sky:#2ee6ff;--lemon:#ffe14d;--ink:#25134a;--paper:#fffaf0}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,sans-serif;color:var(--ink);height:100vh;height:100dvh;padding:16px;display:flex;
 background:radial-gradient(circle at 10% 10%,var(--lemon) 0,transparent 35%),radial-gradient(circle at 90% 90%,var(--sky) 0,transparent 40%),linear-gradient(135deg,var(--pink),var(--grape))}
h1,h2,h3,.brand{font-family:'Baloo 2',cursive}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);background:var(--lemon);color:var(--ink);border-radius:14px;padding:8px 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,textarea{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink)}
.hide{display:none!important}
#login{margin:auto;background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:32px;width:min(400px,100%);display:grid;gap:12px;text-align:center}
#login .big{font-size:64px;line-height:1}
#login h1{font-size:34px}
#err{color:#d6003f;font-weight:700;min-height:22px}
#app{margin:0 auto;width:100%;max-width:1280px;background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);display:flex;overflow:hidden}
aside{width:300px;border-right:4px solid var(--ink);display:flex;flex-direction:column;background:#fff3fb}
.me{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:4px solid var(--ink);background:var(--sky)}
.av{font-size:28px;width:46px;height:46px;border:3px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;position:relative}
.av.sm{width:38px;height:38px;font-size:22px}
.dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#aaa;border:3px solid var(--ink)}
.dot.on{background:#27e36b}
.me b{font-family:'Baloo 2';font-size:19px;display:block;line-height:1.1}
.me small{display:block}
.tools{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.tools button{padding:5px 10px;font-size:14px}
#ulist{overflow:auto;flex:1;padding:6px 10px 14px}
#ulist h3{padding:6px 4px;font-size:16px}
.u{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:12px}
.u span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.u.off{opacity:.55}
.u button{padding:2px 6px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.tag{font-size:12px;background:var(--pink);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:4px solid var(--ink);background:var(--lemon)}
header h2{font-size:24px;flex:1}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;
 background:repeating-linear-gradient(45deg,#fff7d6 0 18px,#fffaf0 18px 36px)}
.row{display:flex;gap:8px;align-items:flex-end;max-width:78%}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#fff;border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);position:relative;min-width:80px}
.mine .bub{background:var(--sky);border-radius:18px 18px 4px 18px}
.nm{font-family:'Baloo 2';font-weight:800;font-size:15px;line-height:1.2}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tm{font-size:11px;opacity:.6;text-align:right}
.quote{border-left:5px solid var(--pink);background:#0001;border-radius:8px;padding:3px 8px;margin:3px 0;font-size:13px}
.acts{position:absolute;top:-16px;right:6px;display:none;gap:4px}
.row:hover .acts{display:flex}
.acts button{padding:0 6px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
#rep{padding:6px 18px;background:#ffe8f4;border-top:3px solid var(--ink);display:flex;gap:10px;align-items:center}
#rep span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
form{display:flex;gap:10px;padding:12px 18px;border-top:4px solid var(--ink);background:var(--pink)}
form textarea{resize:none;height:48px}
form button{background:var(--lemon);font-size:20px}
.modal{position:fixed;inset:0;background:#25134acc;display:grid;place-items:center;padding:16px;z-index:9}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid button{font-size:24px;padding:4px;box-shadow:none;background:#fff}
.grid button.sel{background:var(--pink);transform:scale(1.1)}
label{font-weight:700;font-size:14px}
pre{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;white-space:pre-wrap;font-family:Nunito}
.empty{margin:auto;text-align:center;font-size:18px}
@media(max-width:820px){body{padding:0}#app{border-radius:0;border-width:0}aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s}aside.open{transform:none}#menu{display:inline-block}.row{max-width:92%}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>

<section id="login">
  <div class="big">🐼</div>
  <h1>KelasNgobrol</h1>
  <p>Masuk pakai nama panggilan dari guru ya!</p>
  <input id="ln" placeholder="Nama panggilan" autocomplete="username">
  <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <div id="err"></div>
  <button id="lb">Masuk kelas</button>
</section>

<div id="app" class="hide">
  <aside id="side">
    <div class="me"><div class="av" id="mav"></div><div><b id="mnm"></b><small id="mrole"></small></div></div>
    <div class="tools">
      <button id="bprof">Profil</button>
      <button id="badd" class="hide">Kelola siswa</button>
      <button id="bout">Keluar</button>
    </div>
    <div id="ulist"></div>
  </aside>
  <main>
    <header><button id="menu">👥</button><h2>Ruang Kelas 🎉</h2><span id="cnt"></span></header>
    <div id="msgs"></div>
    <div id="rep" class="hide"><span id="reptxt"></span><button id="repx">Batal</button></div>
    <form id="f"><textarea id="in" placeholder="Tulis pesan..." maxlength="500"></textarea><button>Kirim 🚀</button></form>
  </main>
</div>

<script>
// ====== GANTI dengan URL Web App dari Apps Script ======
const API = 'https://script.google.com/macros/s/AKfycbzzzQHJNhycIMn9gvwVqYGYmkO9-bC0zXK44HnOQi0CII-the3Q9exUUHKvaNYNgIYZuw/exec';
// =======================================================
const ANIMALS = '🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐧🦉🦄🐝🦋🐢🐙🐬🐳🦒🦥🦦🦜🦩'.match(/\p{Extended_Pictographic}/gu);
const COLORS = ['#d6003f','#7b4dff','#0087a8','#b86e00','#008f4c','#c2007a'];
const $ = id => document.getElementById(id);
const S = { uid:null, pw:null, users:{}, msgs:[], re:null, last:'' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = t => new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const color = uid => COLORS[[...uid].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];

async function call(a, data = {}) {
  const res = await fetch(API, { method:'POST', body: JSON.stringify({ a, uid:S.uid, pw:S.pw, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

// ---------- Login ----------
async function login() {
  $('err').textContent = '';
  try {
    const pw = $('lp').value;
    const j = await call('login', { nama:$('ln').value, pw });
    S.uid = j.uid; S.pw = pw;
    sessionStorage.setItem('kn', JSON.stringify({ uid:S.uid, pw }));
    start();
  } catch (e) { $('err').textContent = e.message; }
}
$('lb').onclick = login;
$('lp').onkeydown = e => e.key === 'Enter' && login();
$('bout').onclick = () => { sessionStorage.removeItem('kn'); location.reload(); };

let timer;
async function start() {
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  await tick(); timer = setInterval(tick, 3000);
}
async function tick() {
  try {
    const j = await call('poll');
    S.users = Object.fromEntries(j.users.map(u => [u.uid, u])); S.msgs = j.msgs;
    const key = JSON.stringify(j);
    if (key !== S.last) { S.last = key; render(); }
  } catch (e) {
    if (/Sesi/.test(e.message)) { sessionStorage.removeItem('kn'); location.reload(); }
  }
}

// ---------- Render ----------
function render() {
  const me = S.users[S.uid], admin = me.role === 'admin';
  $('mav').textContent = me.avatar; $('mnm').textContent = me.nama;
  $('mrole').textContent = admin ? 'Guru (admin)' : 'Siswa';
  $('badd').classList.toggle('hide', !admin);

  const list = Object.values(S.users).sort((a,b) => b.online - a.online || a.nama.localeCompare(b.nama));
  const on = list.filter(u => u.online).length;
  $('cnt').textContent = `🟢 ${on} online`;
  $('ulist').innerHTML = `<h3>Anggota kelas (${on}/${list.length} online)</h3>` + list.map(u => `
    <div class="u ${u.online ? '' : 'off'}">
      <div class="av sm">${u.avatar}<i class="dot ${u.online ? 'on' : ''}"></i></div>
      <span class="n">${esc(u.nama)}${u.role === 'admin' ? ' <span class="tag">guru</span>' : ''}${u.muteUntil ? ' 🔇' : ''}</span>
      ${admin && u.role !== 'admin' ? `<button data-mute="${u.uid}" title="${u.muteUntil ? 'Buka mute' : 'Mute'}">${u.muteUntil ? '🔊' : '🔇'}</button><button data-reset="${u.uid}" title="Reset password">🔑</button>` : ''}
    </div>`).join('');

  const box = $('msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = S.msgs.length ? S.msgs.map(m => {
    const u = S.users[m.uid] || { nama:'(dihapus)', avatar:'👻' }, mine = m.uid === S.uid;
    const q = m.re && S.msgs.find(x => x.id === m.re);
    const can = admin || mine;
    return `<div class="row ${mine ? 'mine' : ''}">
      <div class="av sm">${u.avatar}</div>
      <div class="bub">
        <div class="acts"><button data-re="${m.id}" title="Balas">↩</button>${can ? `<button data-del="${m.id}" title="Hapus">🗑</button>` : ''}</div>
        ${mine ? '' : `<div class="nm" style="color:${color(m.uid)}">${esc(u.nama)}</div>`}
        ${m.re ? `<div class="quote">${q ? `<b>${esc((S.users[q.uid]||{}).nama||'')}</b><br>${esc(q.text.slice(0,80))}` : 'Pesan lama'}</div>` : ''}
        <div class="txt">${esc(m.text)}</div><div class="tm">${hhmm(m.t)}</div>
      </div></div>`;
  }).join('') : '<div class="empty">Belum ada pesan.<br>Jadi yang pertama menyapa! 👋</div>';
  if (near) box.scrollTop = box.scrollHeight;

  const muted = me.muteUntil > Date.now();
  $('in').disabled = muted;
  $('in').placeholder = muted ? `Kamu di-mute guru sampai ${hhmm(me.muteUntil)} 🤫` : 'Tulis pesan...';
}

// ---------- Aksi ----------
$('ulist').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.mute) {
      const u = S.users[b.dataset.mute];
      const m = u.muteUntil ? 0 : parseInt(prompt(`Mute ${u.nama} berapa menit?`, '5'));
      if (m >= 0) await call('mute', { target:u.uid, mins:m });
    }
    if (b.dataset.reset) {
      const u = S.users[b.dataset.reset], p = prompt(`Password baru untuk ${u.nama}:`, 'siswa123');
      if (p) { await call('reset', { target:u.uid, pw2:p }); alert('Password direset.'); }
    }
    tick();
  } catch (er) { alert(er.message); }
};
$('msgs').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.re) {
    const m = S.msgs.find(x => x.id === b.dataset.re); S.re = m.id;
    $('reptxt').textContent = `Membalas ${S.users[m.uid].nama}: ${m.text.slice(0,60)}`;
    $('rep').classList.remove('hide'); $('in').focus();
  }
  if (b.dataset.del && confirm('Hapus pesan ini?')) {
    try { await call('del', { id:b.dataset.del }); tick(); } catch (er) { alert(er.message); }
  }
};
$('repx').onclick = () => { S.re = null; $('rep').classList.add('hide'); };
$('f').onsubmit = async e => {
  e.preventDefault();
  const text = $('in').value.trim(); if (!text) return;
  $('in').value = '';
  try { await call('send', { text, re:S.re }); $('repx').click(); await tick(); $('msgs').scrollTop = 1e9; }
  catch (er) { alert(er.message); $('in').value = text; }
};
$('in').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } };
$('menu').onclick = () => $('side').classList.toggle('open');

// ---------- Modal ----------
function modal(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card">${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.append(m); return m;
}
$('bprof').onclick = () => {
  const me = S.users[S.uid]; let av = me.avatar;
  const m = modal(`<h2>Profil kamu</h2>
    <label>Pilih ikon hewan</label><div class="grid">${ANIMALS.map(a => `<button type="button" class="${a === av ? 'sel' : ''}">${a}</button>`).join('')}</div>
    <label>Nama panggilan</label><input id="pn" value="${esc(me.nama)}" maxlength="20">
    <label>Password baru (kosongkan jika tidak diganti)</label><input id="pp" type="password" autocomplete="new-password">
    <div id="pe" style="color:#d6003f;font-weight:700"></div>
    <button id="ps">Simpan</button>`);
  m.querySelector('.grid').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    av = b.textContent; m.querySelectorAll('.grid button').forEach(x => x.classList.toggle('sel', x === b));
  };
  m.querySelector('#ps').onclick = async () => {
    try {
      const newpw = m.querySelector('#pp').value;
      await call('profile', { nama:m.querySelector('#pn').value, avatar:av, newpw });
      if (newpw) { S.pw = newpw; sessionStorage.setItem('kn', JSON.stringify({ uid:S.uid, pw:newpw })); }
      m.remove(); tick();
    } catch (e) { m.querySelector('#pe').textContent = e.message; }
  };
};
$('badd').onclick = () => {
  const m = modal(`<h2>Buat akun siswa</h2>
    <label>Nama panggilan (satu per baris atau pisah koma)</label><textarea id="an" rows="6" placeholder="Budi&#10;Sari&#10;Dimas"></textarea>
    <label>Password default</label><input id="ad" value="siswa123">
    <button id="ab">Buat akun</button><div id="ar"></div>`);
  m.querySelector('#ab').onclick = async () => {
    try {
      const j = await call('add', { names:m.querySelector('#an').value, defpw:m.querySelector('#ad').value });
      const txt = j.made.map(x => `${x.nama} / ${x.pw}`).join('\n');
      m.querySelector('#ar').innerHTML = `<p>${j.made.length} akun dibuat${j.skip.length ? `, dilewati (sudah ada): ${esc(j.skip.join(', '))}` : ''}.</p><pre>${esc(txt)}</pre><button id="cp">Salin daftar</button>`;
      m.querySelector('#cp').onclick = () => navigator.clipboard.writeText(txt);
      tick();
    } catch (e) { alert(e.message); }
  };
};

// ---------- Auto login ----------
try { const s = JSON.parse(sessionStorage.getItem('kn')); if (s) { S.uid = s.uid; S.pw = s.pw; start(); } } catch (e) {}
</script>
</body>
</html>
